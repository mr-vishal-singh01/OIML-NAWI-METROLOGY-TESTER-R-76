name: PrecisionX Sovereign Metrology CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  metrology-test-suite:
    name: OIML R-76 & Cryptographic Test Suite (142 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libzbar0 qrencode zbar-tools

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Full 142-Test Metrology Suite
        env:
          PYTHONPATH: "src:."
        run: |
          python -m unittest discover tests

      - name: Verify Statutory OIML R-76 Pattern Evaluation Schema
        run: |
          python3 -c "
          import os, json
          schema_path = 'schemas/oiml_r76_form_schema.json'
          assert os.path.exists(schema_path), 'OIML R-76 Schema missing'
          with open(schema_path) as f:
              data = json.load(f)
              assert data.get('title') == 'OIML_R76_2_Pattern_Evaluation_Schema'
          print('✅ Statutory OIML R-76 Pattern Evaluation Schema Verified.')
          "
