name: PrecisionX Sovereign Metrology CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  metrology-test-suite:
    name: OIML R-76 & Cryptographic Test Suite (142 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libglib2.0-0 qrencode zbar-tools

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest fastapi httpx

      - name: Run Full 142-Test Metrology Suite
        env:
          PYTHONPATH: "src:."
        run: |
          python -m unittest discover tests

      - name: Verify Statutory XML & PDF/A-3 Schemas
        run: |
          python3 -c "
          import os
          assert os.path.exists('schemas/dcc.xsd'), 'PTB DCC schema missing'
          assert os.path.exists('schemas/nawi_session.json'), 'Session schema missing'
          print('✅ All Statutory Metrology Schemas Verified.')
          "
