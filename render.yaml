services:
  - type: web
    name: precisionx-legal-metrology
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --app-dir src --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
